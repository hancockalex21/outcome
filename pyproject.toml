[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome"
version = "0.1.0"
description = "Independent trust and authorization control plane for autonomous AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp==2.2.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
outcome-api = "outcome.api.main:run"
outcome-benchmark = "outcome.benchmarks.cli:main"
outcome-mcp = "outcome.mcp.main:run"
outcome-mcp-http = "outcome.mcp.http:run"
outcome-worker = "outcome.worker.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outcome = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["outcome"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
