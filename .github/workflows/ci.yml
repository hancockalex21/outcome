name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outcome
          POSTGRES_USER: outcome
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outcome -d outcome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTCOME_POSTGRES_ADMIN_URL: postgresql://outcome@127.0.0.1:5432/outcome

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make security-test
      - run: make test
      - run: make benchmark
      - run: make security-check
      - run: make production-smoke
      - run: docker build -f Dockerfile.api -t outcome-api:ci .
      - run: docker build -f Dockerfile.mcp -t outcome-mcp:ci .
      - run: docker build -f Dockerfile.worker -t outcome-worker:ci .

  controlled-beta-acceptance:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make acceptance-local
