services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OUTCOME_ENV: local
      OUTCOME_LOG_LEVEL: info
      OUTCOME_API_HOST: 0.0.0.0
      OUTCOME_API_PORT: 8000
      OUTCOME_DATABASE_URL: postgresql+asyncpg://outcome@postgres:5432/outcome
      OUTCOME_REDIS_URL: redis://redis:6379/0
      OUTCOME_RESERVATION_TTL_SECONDS: 900
      OUTCOME_MAX_BILLABLE_EXECUTION_WINDOW_SECONDS: 600
      OUTCOME_RESERVATION_TTL_SAFETY_MARGIN_SECONDS: 120
      OUTCOME_OTEL_SERVICE_NAME: outcome-api
      OUTCOME_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      OUTCOME_ENV: local
      OUTCOME_LOG_LEVEL: info
      OUTCOME_MCP_HTTP_HOST: 0.0.0.0
      OUTCOME_MCP_HTTP_PORT: 8001
      OUTCOME_MCP_HTTP_PATH: /mcp
      OUTCOME_MCP_ALLOWED_HOSTS: localhost,127.0.0.1
      OUTCOME_MCP_DATABASE_URL: sqlite:////app/outcome-mcp-local.db
      OUTCOME_DATABASE_URL: postgresql+asyncpg://outcome@postgres:5432/outcome
      OUTCOME_REDIS_URL: redis://redis:6379/0
      OUTCOME_MCP_RECEIPT_SIGNING_KEY_ID: outcome-mcp-dev-key
      OUTCOME_MCP_RECEIPT_PRIVATE_KEY_B64: ""
      OUTCOME_RESERVATION_TTL_SECONDS: 900
      OUTCOME_MAX_BILLABLE_EXECUTION_WINDOW_SECONDS: 600
      OUTCOME_RESERVATION_TTL_SAFETY_MARGIN_SECONDS: 120
      OUTCOME_OTEL_SERVICE_NAME: outcome-mcp
      OUTCOME_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      OUTCOME_ENV: local
      OUTCOME_LOG_LEVEL: info
      OUTCOME_DATABASE_URL: postgresql+asyncpg://outcome@postgres:5432/outcome
      OUTCOME_REDIS_URL: redis://redis:6379/0
      OUTCOME_WORKER_SECRET_RESOLVER_BACKEND: development
      OUTCOME_RESERVATION_TTL_SECONDS: 900
      OUTCOME_MAX_BILLABLE_EXECUTION_WINDOW_SECONDS: 600
      OUTCOME_RESERVATION_TTL_SAFETY_MARGIN_SECONDS: 120
      OUTCOME_OTEL_SERVICE_NAME: outcome-worker
      OUTCOME_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outcome
      POSTGRES_USER: outcome
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
